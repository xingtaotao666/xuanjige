name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check pre-installed Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"

      - name: Install needed SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Downgrade compileSdk to 34
        working-directory: frontend/android
        run: |
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/' variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/' variables.gradle
          cat variables.gradle

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web app
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build log tail on failure
        if: failure()
        working-directory: frontend/android
        run: tail -80 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xuanjige-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
