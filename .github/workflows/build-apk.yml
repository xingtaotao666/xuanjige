name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/vite.config.ts'
      - 'frontend/capacitor.config.ts'
      - 'frontend/android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools

      - name: Show env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "No ANDROID_HOME"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web app
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Prepare gradle
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Current dir: $(pwd)"
          cat local.properties
          ls -la

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: frontend/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g
        run: |
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== exit=$? ==="

      - name: List APK output
        if: always()
        working-directory: frontend/android
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" 2>/dev/null
          echo "=== build.log tail ==="
          tail -50 build.log 2>/dev/null || echo "no log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 玄机阁-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
